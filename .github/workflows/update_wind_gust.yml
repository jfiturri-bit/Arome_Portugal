name: Update AROME Portugal Wind+Gust TEST

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5,17 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download matching IPMA wind and gust
        run: |
          python - <<'PY'
          import datetime
          import os
          import subprocess
          import time

          base = "https://mf2.ipma.pt/downloads/data/arome"
          now = datetime.datetime.now(datetime.timezone.utc)

          candidates = []
          for days_back in range(3):
              d = now - datetime.timedelta(days=days_back)
              for run in (12, 0):
                  dt = d.replace(hour=run, minute=0, second=0, microsecond=0)
                  if dt <= now:
                      candidates.append(dt)
          candidates.sort(reverse=True)

          def download_with_resume(url, target):
              if os.path.exists(target):
                  os.remove(target)
              for attempt in range(30):
                  size = os.path.getsize(target) if os.path.exists(target) else 0
                  print(f"{target} attempt {attempt+1}: {size/1024/1024:.1f} MB")
                  r = subprocess.run([
                      "curl", "-L", "--fail",
                      "--connect-timeout", "30",
                      "--max-time", "180",
                      "-C", "-", "-o", target, url
                  ])
                  if r.returncode == 0:
                      return True
                  time.sleep(5)
              return False

          for dt in candidates:
              date = dt.strftime("%Y/%m/%d")
              run = dt.strftime("%H")
              stamp = dt.strftime("%Y%m%d%H")
              root = f"{base}/{date}/run_{run}"
              wind = f"{root}/AROME_OPER_001_FC_SP_PT2_025_UVCOMP_10-HTGL_{stamp}.nc"
              gust = f"{root}/AROME_OPER_001_FC_SP_PT2_025_GUSTMOD_10-HTGL_{stamp}.nc"

              print("Trying run", stamp)
              if not download_with_resume(wind, "wind.nc"):
                  continue
              if not download_with_resume(gust, "gust.nc"):
                  continue

              with open("run.txt", "w") as f:
                  f.write(stamp)
              print("SUCCESS matching run:", stamp)
              raise SystemExit(0)

          raise RuntimeError("Could not download matching wind+gust run")
          PY

      - name: Convert Wind+Gust to GRIB2
        run: |
          python convert_ipma_to_grib_wind_gust.py wind.nc gust.nc arome-ipma-pt2-wind-gust.grib2

        
      - name: Publish latest AROME Portugal
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest AROME Portugal
          prerelease: false
          make_latest: true
          files: arome-ipma-pt2-wind-gust.grib2

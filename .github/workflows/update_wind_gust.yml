name: Update AROME Portugal Wind+Gust

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7,19 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest IPMA wind and gust
        run: |
          set -e

          USERAGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/121.0 Safari/537.36"
          REFERER="https://mf2.ipma.pt/downloads/"

          WIND_URL="https://mf2.ipma.pt/downloads/?latest=arome.10m.wind&region=PT2"
          GUST_URL="https://mf2.ipma.pt/downloads/?latest=arome.10m.gustintensity&region=PT2"

          # Start a normal web session and keep cookies
          curl -L \
            -A "$USERAGENT" \
            -e "$REFERER" \
            -c cookies.txt \
            "$REFERER" \
            -o /dev/null || true

          download_file () {
            URL="$1"
            FILE="$2"

            rm -f "$FILE"

            for attempt in $(seq 1 20); do
              echo "Attempt $attempt downloading $FILE"

              curl -L \
                --fail \
                --connect-timeout 30 \
                --max-time 240 \
                -A "$USERAGENT" \
                -e "$REFERER" \
                -b cookies.txt \
                -c cookies.txt \
                -C - \
                "$URL" \
                -o "$FILE" && return 0

              echo "Download interrupted or rejected. Waiting 15 seconds..."
              sleep 15
            done

            return 1
          }

          download_file "$WIND_URL" wind.nc
          download_file "$GUST_URL" gust.nc

          ls -lh wind.nc gust.nc

      - name: Validate NetCDF and matching AROME run
        run: |
          python - <<'PY'
          import h5py
          import os

          def inspect(path):
              if os.path.getsize(path) < 1000000:
                  raise RuntimeError(f"{path} is suspiciously small")

              with h5py.File(path, "r") as f:
                  if "UV" not in f:
                      raise RuntimeError(f"{path}: UV variable not found")

                  if "time" not in f:
                      raise RuntimeError(f"{path}: time variable not found")

                  units = f["time"].attrs.get("units")
                  if isinstance(units, bytes):
                      units = units.decode()

                  print(path)
                  print("  UV shape:", f["UV"].shape)
                  print("  time units:", units)
                  return str(units)

          wind_run = inspect("wind.nc")
          gust_run = inspect("gust.nc")

          if wind_run != gust_run:
              raise RuntimeError(
                  f"Wind and gust belong to different runs: "
                  f"{wind_run} vs {gust_run}"
              )

          print("MATCHING AROME RUN:", wind_run)

          with open("run.txt", "w") as f:
              f.write(wind_run)
          PY

      - name: Convert Wind+Gust to GRIB2
        run: |
          python convert_ipma_to_grib_wind_gust.py \
            wind.nc \
            gust.nc \
            arome-ipma-pt2-wind-gust.grib2

      - name: Show selected AROME run
        run: |
          echo "AROME run used:"
          cat run.txt
          ls -lh arome-ipma-pt2-wind-gust.grib2

      - name: Publish latest AROME Portugal
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest AROME Portugal
          prerelease: false
          make_latest: true
          files: arome-ipma-pt2-wind-gust.grib2

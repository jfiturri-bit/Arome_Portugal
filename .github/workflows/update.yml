name: Update AROME Portugal GRIB2

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5,17 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest IPMA AROME UVCOMP
        run: |
          python - <<'PY'
          import datetime
          import os
          import subprocess
          import time

          base = "https://mf2.ipma.pt/downloads/data/arome"
          now = datetime.datetime.now(datetime.timezone.utc)

          candidates = []
          for days_back in range(3):
              d = now - datetime.timedelta(days=days_back)
              for run in (12, 0):
                  dt = d.replace(hour=run, minute=0, second=0, microsecond=0)
                  if dt <= now:
                      candidates.append(dt)

          candidates.sort(reverse=True)

          def download_with_resume(url, target):
              if os.path.exists(target):
                  os.remove(target)

              for attempt in range(30):
                  size = os.path.getsize(target) if os.path.exists(target) else 0
                  print(f"Attempt {attempt+1}: {size/1024/1024:.1f} MB downloaded")

                  result = subprocess.run([
                      "curl",
                      "-L",
                      "--fail",
                      "--connect-timeout", "30",
                      "--max-time", "180",
                      "-C", "-",
                      "-o", target,
                      url
                  ])

                  if result.returncode == 0:
                      print("Download completed.")
                      return True

                  print(f"Connection interrupted. Resuming in 5 seconds...")
                  time.sleep(5)

              return False

          for dt in candidates:
              date = dt.strftime("%Y/%m/%d")
              run = dt.strftime("%H")
              stamp = dt.strftime("%Y%m%d%H")

              filename = (
                  f"AROME_OPER_001_FC_SP_PT2_025_"
                  f"UVCOMP_10-HTGL_{stamp}.nc"
              )

              url = f"{base}/{date}/run_{run}/{filename}"
              print(f"Trying: {url}")

              if download_with_resume(url, "latest.nc"):
                  print(f"SUCCESS: {url}")
                  raise SystemExit(0)

          raise RuntimeError("Could not download recent IPMA AROME UVCOMP")
          PY

      - name: Inspect downloaded NetCDF
        run: |
          python - <<'PY'
          import h5py
          import os

          print("File size:", os.path.getsize("latest.nc"))
          with h5py.File("latest.nc", "r") as f:
              print("Variables:", list(f.keys()))
              if "UV" not in f:
                  raise RuntimeError("UV variable not found")
              print("UV shape:", f["UV"].shape)
          PY

      - name: Convert NetCDF to GRIB2
        run: |
          python convert_ipma_to_grib.py latest.nc arome-ipma-pt2-wind.grib2

      - name: Publish latest GRIB2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest AROME Portugal
          prerelease: false
          make_latest: true
          files: arome-ipma-pt2-wind.grib2

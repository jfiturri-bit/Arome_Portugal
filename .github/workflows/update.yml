name: Update AROME Portugal GRIB2

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5,17 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest IPMA AROME UVCOMP
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import os
          import subprocess

          now = datetime.now(timezone.utc)
          candidates = []

          for days_ago in range(3):
              day = now.date() - timedelta(days=days_ago)

              for hour in (12, 0):
                  dt = datetime(
                      day.year, day.month, day.day,
                      hour, tzinfo=timezone.utc
                  )

                  filename = (
                      f"AROME_OPER_001_FC_SP_PT2_025_UVCOMP_10-HTGL_"
                      f"{dt:%Y%m%d%H}.nc"
                  )

                  url = (
                      f"https://mf2.ipma.pt/downloads/data/arome/"
                      f"{dt:%Y/%m/%d}/run_{hour:02d}/{filename}"
                  )

                  candidates.append((dt, url))

          candidates.sort(reverse=True)

          downloaded = False

          for dt, url in candidates:
              print("Trying:", url)

              if os.path.exists("latest.nc"):
                  os.remove("latest.nc")

              result = subprocess.run([
                  "curl",
                  "-L",
                  "--fail",
                  "--retry", "10",
                  "--retry-delay", "10",
                  "--retry-all-errors",
                  "--connect-timeout", "30",
                  "--max-time", "1800",
                  "-C", "-",
                  url,
                  "-o", "latest.nc"
              ])

              if result.returncode == 0 and os.path.getsize("latest.nc") > 1000000:
                  print("Downloaded:", filename)
                  print("Size:", os.path.getsize("latest.nc"))
                  downloaded = True
                  break

          if not downloaded:
              raise RuntimeError("Could not download any recent IPMA AROME UVCOMP file")
          PY

      - name: Inspect downloaded NetCDF
        run: |
          python - <<'PY'
          import h5py

          with h5py.File("latest.nc", "r") as f:
              print("Top-level variables/groups:")
              for key in f.keys():
                  print(" -", key)

              if "UV" in f:
                  print("UV shape:", f["UV"].shape)
              else:
                  print("WARNING: UV not found at top level")
          PY

      - name: Convert NetCDF to GRIB2
        run: |
          python convert_ipma_to_grib.py \
            latest.nc \
            arome-ipma-pt2-wind.grib2

      - name: Publish latest GRIB2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest AROME Portugal
          prerelease: false
          make_latest: true
          files: arome-ipma-pt2-wind.grib2
